[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fuzz = { runs = 256 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"

[invariant]
runs = 64
depth = 30
fail_on_revert = false

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 30, fail_on_revert = false }
